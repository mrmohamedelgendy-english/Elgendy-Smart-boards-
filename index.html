<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حساب الشاشات</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0f6e56">
<meta name="apple-mobile-web-app-title" content="حساب الشاشات">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a66;--bd:#e3e1da;--ac:#0f6e56;--acbg:#e1f5ee;--red:#b3261e;--redbg:#fcebea;--amb:#8a5a00;--ambbg:#fdf0d5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161614;--card:#222220;--tx:#f1efe8;--mut:#a3a29c;--bd:#37362f;--ac:#5dcaa5;--acbg:#0d3a2e;--red:#f09595;--redbg:#3d1a18;--amb:#f0c36b;--ambbg:#3a2c0b}}
:root[data-theme="dark"]{--bg:#161614;--card:#222220;--tx:#f1efe8;--mut:#a3a29c;--bd:#37362f;--ac:#5dcaa5;--acbg:#0d3a2e;--red:#f09595;--redbg:#3d1a18;--amb:#f0c36b;--ambbg:#3a2c0b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:22px;margin:4px 0 14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.sum small{display:block;color:var(--mut);font-size:12px}.sum b{font-size:16px}
.sum .r b{color:var(--red)}.sum .g b{color:var(--ac)}
input,button{font:inherit;color:inherit}
input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.bar{display:flex;gap:8px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:8px;border:1px solid var(--bd);background:var(--card);border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-weight:600}.mut{color:var(--mut);font-size:13px}
.pill{font-size:13px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.due{background:var(--redbg);color:var(--red)}.ok{background:var(--acbg);color:var(--ac)}
.pg{height:6px;background:var(--bd);border-radius:9px;margin-top:8px;overflow:hidden}.pg i{display:block;height:100%;background:var(--ac)}
.fab{position:fixed;inset-inline-start:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ac);color:var(--bg);border:0;border-radius:99px;padding:14px 20px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.pay{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.p{background:var(--ac);color:var(--bg);border-color:var(--ac)}.btn.d{color:var(--red)}
.x{background:none;border:0;color:var(--red);font-size:18px;cursor:pointer}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.empty{text-align:center;color:var(--mut);padding:30px}
.snd{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:12px 0}.snd pre{white-space:pre-wrap;font:inherit;font-size:14px;margin:8px 0}.snd a{text-decoration:none;text-align:center}.snd .btn{flex:1;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>📺 حساب الشاشات</h1>
  <div class="sum">
    <div><small>إجمالي السعر</small><b id="tP">0</b></div>
    <div class="g"><small>المدفوع</small><b id="tPaid">0</b></div>
    <div class="r"><small>المتبقي</small><b id="tR">0</b></div>
  </div>
  <div class="bar"><input id="q" type="search" placeholder="ابحث بالاسم..."></div>
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">الكل</button><button data-f="due">عليه متبقي</button><button data-f="done">خالص</button>
  </div>
  <div class="bar"><button class="btn" id="ex" style="flex:1">⬇ تصدير Excel</button><button class="btn" id="im" style="flex:1">⬆ استيراد Excel</button><input id="fi" type="file" accept=".xlsx,.xls" hidden></div>
  <div id="list"></div>
</div>
<button class="fab" id="add">＋ عميل جديد</button>
<div class="ov" id="ov"><div class="sheet" id="sh"></div></div>

<script>
var SEED=[["باسم سبح الله",50,[20,10,20]],["محمد عبد السميع رياضة",50,[20,30]],["شريف عبد السلام رياضة",55,[13,7,10,15,5]],["محمود رمضان درسات",55,[28,27]],["محمد فاروق والسيد",45,[15,15,15]],["محمد فوزى عربى",56,[20,5,6,10,14]],["صالح السراجى",51,[8,6.2,15,3.5,5,5]],["عبد السلام درويش عربى",58,[30,10,18]],["السعيد مدكور تاريخ",58,[28,6,6,6]],["محمود المنسى",50,[50]],["شيماء الكاشف",58,[20,13,6,19]],["هشام فهمي فيزياء",55,[40,15]],["محمد عبد الغنى",51,[51]],["محمد السعيد",56.5,[16.5,20,20]],["محمود المنسى (2)",51,[30,21]],["محمد طلعت",56,[25,25,6]],["فرج عمار",56.5,[54,2.5]],["محمد عبده",61.6,[25,5]],["محمد فتحى معتز",45,[14.7,15]],["فرج",11.8,[6]],["اليمانى",6,[]]];
var KEY="screens-accounts-v1",D=[],filter="all",cur=null;
function load(){try{var s=localStorage.getItem(KEY);if(s){D=JSON.parse(s);return}}catch(e){}
  D=SEED.map(function(r,i){return{id:i+1,name:r[0],price:r[1],pays:r[2].slice()}})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function n(x){return Math.round(x*100)/100}
function fmt(x){return n(x)+" ألف"}
function paid(c){return n(c.pays.reduce(function(a,b){return a+b},0))}
function rem(c){return Math.max(0,n(c.price-paid(c)))}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function render(){
  var tp=0,tpd=0,tr=0;D.forEach(function(c){tp+=c.price;tpd+=paid(c);tr+=rem(c)});
  $("tP").textContent=fmt(tp);$("tPaid").textContent=fmt(tpd);$("tR").textContent=fmt(tr);
  var q=$("q").value.trim();
  var L=D.filter(function(c){return(!q||c.name.indexOf(q)>-1)&&(filter=="all"||(filter=="due"?rem(c)>0:rem(c)==0))});
  $("list").innerHTML=L.length?L.map(function(c){
    var r=rem(c),pc=c.price?Math.min(100,paid(c)/c.price*100):0;
    return '<div class="c" data-id="'+c.id+'"><div class="row"><div><div class="nm">'+esc(c.name)+'</div><div class="mut">السعر '+fmt(c.price)+' · مدفوع '+fmt(paid(c))+'</div></div><span class="pill '+(r?"due":"ok")+'">'+(r?"متبقي "+fmt(r):"خالص ✓")+'</span></div><div class="pg"><i style="width:'+pc+'%"></i></div></div>'}).join(""):'<div class="empty">مفيش نتائج</div>';
}
function open_(h){$("sh").innerHTML=h;$("ov").classList.add("show")}
function close_(){$("ov").classList.remove("show");cur=null}
function saveFile(blob,name){
  var done=function(){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()};
  if(window.claude&&claude.use){claude.use("downloads").then(function(d){if(d){d.save({filename:name,data:blob}).catch(function(){})}else done()}).catch(done)}else done()}
function exportX(){
  if(!window.XLSX){alert("مكتبة Excel لم تُحمّل، تأكد من الاتصال بالإنترنت");return}
  var mx=D.reduce(function(m,c){return Math.max(m,c.pays.length)},1);
  var rows=D.map(function(c){var o={"الاسم":c.name,"الموبايل":c.ph||"","السعر (ألف)":c.price};
    for(var i=0;i<mx;i++)o[i==0?"المقدم":"دفعة "+i]=c.pays[i]===undefined?"":c.pays[i];
    o["المدفوع"]=paid(c);o["المتبقي"]=rem(c);return o});
  var wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows);ws["!views"]=[{RTL:true}];
  XLSX.utils.book_append_sheet(wb,ws,"حساب الشاشات");
  var arr=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  saveFile(new Blob([arr],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}),"screens-accounts.xlsx")}
function importX(file){
  if(!window.XLSX){alert("مكتبة Excel لم تُحمّل، تأكد من الاتصال بالإنترنت");return}
  var r=new FileReader();
  r.onload=function(){try{
    var wb=XLSX.read(r.result,{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""}),out=[],id=1;
    rows.forEach(function(row){var nm="",ph="",pr=NaN,pays=[];
      Object.keys(row).forEach(function(k){var h=k.trim(),v=row[k];
        if(h=="الاسم")nm=String(v).trim();
        else if(h=="الموبايل")ph=String(v).trim();
        else if(h.indexOf("السعر")==0)pr=parseFloat(v);
        else if(h=="المقدم"||h.indexOf("دفعة")==0){var x=parseFloat(v);if(!isNaN(x)&&x>0)pays.push(x)}});
      if(nm&&!isNaN(pr))out.push({id:id++,name:nm,price:pr,ph:ph,pays:pays})});
    if(!out.length){alert("مش لاقي بيانات. لازم أعمدة: الاسم، السعر، المقدم، دفعة 1 ...");return}
    if(confirm("هيتم استبدال كل البيانات الحالية بـ "+out.length+" عميل. متأكد؟")){D=out;save();render()}
  }catch(e){alert("الملف غير صالح")}};
  r.readAsArrayBuffer(file)}
var MSG="";
function phone(p){p=(p||"").replace(/\D/g,"");if(!p)return"";if(p.indexOf("00")==0)p=p.slice(2);else if(p[0]=="0")p="20"+p.slice(1);return p}
var RM=0,LA=0;
function msg(c,a){var r=rem(c);if(RM&&r)return "السلام عليكم "+c.name+"\nتذكير ودي بخصوص حساب الشاشة 📺\nالسعر: "+fmt(c.price)+"\nالمدفوع: "+fmt(paid(c))+"\nالمتبقي: "+fmt(r)+"\nنرجو التكرم بالسداد في أقرب وقت. شكرًا لك 🌷";return "السلام عليكم "+c.name+"\n"+(a?"تم استلام دفعة "+fmt(a)+"\n":"كشف حساب\n")+"السعر: "+fmt(c.price)+"\nإجمالي المدفوع: "+fmt(paid(c))+"\n"+(r?"المتبقي: "+fmt(r):"تم السداد بالكامل ✓ شكرًا لك")}
function sendBox(c,a){MSG=msg(c,a);var t=encodeURIComponent(MSG),p=phone(c.ph),wa="https://wa.me/"+p+"?text="+t,tg="https://t.me/share/url?url=%20&text="+t;
  return '<div class="snd"><div class="mut">'+(a?"✅ تم تسجيل الدفعة — ابعت الإيصال للعميل":"رسالة للعميل")+'</div>'+(rem(c)?'<div class="bar" style="margin:8px 0 0"><button class="btn" id="m1" style="'+(RM?'':'border-color:var(--ac)')+'">إيصال / كشف</button><button class="btn" id="m2" style="'+(RM?'border-color:var(--ac)':'')+'">🔔 تذكير بالدفع</button></div>':'')+'<pre>'+esc(MSG)+'</pre><div class="bar"><a class="btn p" target="_blank" rel="noopener" href="'+wa+'">واتساب</a><a class="btn p" target="_blank" rel="noopener" href="'+tg+'">تلغرام</a><button class="btn" id="cp">نسخ</button></div>'+(p?'':'<div class="mut">أضف رقم الموبايل من «تعديل البيانات» عشان الواتساب يفتح على رقمه مباشرة</div>')+'</div>'}
function copy(s){try{navigator.clipboard.writeText(s).then(function(){alert("تم النسخ")},function(){prompt("انسخ الرسالة:",s)})}catch(e){prompt("انسخ الرسالة:",s)}}
function detail(id,last){LA=last||0;
  var c=D.find(function(x){return x.id==id});if(!c)return;cur=id;
  var r=rem(c);
  open_('<div class="row"><h2 style="margin:0;font-size:19px">'+esc(c.name)+'</h2><button class="x" id="cl" style="color:var(--mut)">✕</button></div>'+
  '<div class="sum" style="margin-top:12px"><div><small>السعر</small><b>'+fmt(c.price)+'</b></div><div class="g"><small>المدفوع</small><b>'+fmt(paid(c))+'</b></div><div class="r"><small>المتبقي</small><b>'+fmt(r)+'</b></div></div>'+
  '<div>'+(c.pays.length?c.pays.map(function(p,i){return '<div class="pay"><span>'+(i==0?"المقدم":"دفعة "+i)+'</span><span><b>'+fmt(p)+'</b> <button class="x" data-del="'+i+'">🗑</button></span></div>'}).join(""):'<div class="empty">لا توجد دفعات بعد</div>')+'</div>'+
  sendBox(c,last)+'<label>إضافة دفعة بالألف'+(r?' (المتبقي '+fmt(r)+')':'')+'</label><div class="bar"><input id="amt" type="number" inputmode="decimal" step="any" placeholder="المبلغ بالألف (مثلاً 2.5)"><button class="btn p" id="pay">تسجيل</button></div>'+
  '<div class="bar" style="margin-top:14px"><button class="btn" id="ed" style="flex:1">تعديل البيانات</button><button class="btn d" id="rm">حذف العميل</button></div>');
}
function form(c){
  open_('<h2 style="margin:0 0 4px;font-size:19px">'+(c?"تعديل البيانات":"عميل جديد")+'</h2>'+
  '<label>الاسم</label><input id="fn" value="'+(c?esc(c.name):"")+'">'+
  '<label>رقم الموبايل (للواتساب)</label><input id="fh" type="tel" inputmode="tel" placeholder="01xxxxxxxxx" value="'+(c&&c.ph?esc(c.ph):"")+'">'+
  '<label>السعر (بالألف)</label><input id="fp" type="number" inputmode="decimal" step="any" value="'+(c?c.price:"")+'">'+
  (c?"":'<label>المقدم بالألف (اختياري)</label><input id="fd" type="number" inputmode="decimal" step="any">')+
  '<div class="bar" style="margin-top:16px"><button class="btn p" id="sv" style="flex:1">حفظ</button><button class="btn" id="cl">إلغاء</button></div>');
  $("sv").onclick=function(){
    var nm=$("fn").value.trim(),pr=parseFloat($("fp").value);
    if(!nm||isNaN(pr)||pr<0){alert("اكتب الاسم والسعر");return}
    if(c){c.name=nm;c.price=pr;c.ph=$("fh").value.trim();save();render();detail(c.id)}
    else{var d=parseFloat($("fd").value),id=D.reduce(function(m,x){return Math.max(m,x.id)},0)+1;
      D.unshift({id:id,name:nm,price:pr,ph:$("fh").value.trim(),pays:isNaN(d)||d<=0?[]:[d]});save();render();close_()}
  };
}
$("list").onclick=function(e){var t=e.target.closest(".c");if(t){RM=0;detail(t.dataset.id)}};
$("add").onclick=function(){form(null)};
$("q").oninput=render;
$("tabs").onclick=function(e){var b=e.target.closest("button");if(!b)return;filter=b.dataset.f;
  [].forEach.call($("tabs").children,function(x){x.classList.toggle("on",x==b)});render()};
$("ov").onclick=function(e){
  var t=e.target;if(t==$("ov")||t.id=="cl"){close_();return}
  var c=D.find(function(x){return x.id==cur});
  if(t.dataset.del!==undefined&&c){if(confirm("حذف الدفعة؟")){c.pays.splice(+t.dataset.del,1);save();render();detail(c.id)}}
  else if(t.id=="pay"&&c){var a=parseFloat($("amt").value);if(isNaN(a)||a<=0){return}c.pays.push(a);save();render();RM=0;detail(c.id,a)}
  else if((t.id=="m1"||t.id=="m2")&&c){RM=t.id=="m2"?1:0;detail(c.id,LA)}
  else if(t.id=="cp")copy(MSG);
  else if(t.id=="ed"&&c)form(c);
  else if(t.id=="rm"&&c){if(confirm("حذف "+c.name+" نهائيًا؟")){D=D.filter(function(x){return x.id!=c.id});save();render();close_()}}
};
$("ex").onclick=exportX;$("im").onclick=function(){$("fi").click()};
$("fi").onchange=function(e){var f=e.target.files[0];if(f)importX(f);e.target.value=""};
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}
load();render();
</script>
</body>
</html>
